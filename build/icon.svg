<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26262c"/>
      <stop offset="1" stop-color="#0b0b0d"/>
    </linearGradient>
    <clipPath id="lens">
      <circle cx="512" cy="512" r="262"/>
    </clipPath>
  </defs>
  <!-- macOS icon grid: 824×824 body centred on the 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="3"/>
  <!-- The lens ring -->
  <circle cx="512" cy="512" r="288" fill="#16161a" stroke="#ffffff" stroke-opacity="0.14" stroke-width="10"/>
  <!-- An aperture of six blades in sunset colours (pink, coral, orange), each from an edge of the opening out past the ring -->
  <g clip-path="url(#lens)" stroke="#0b0b0d" stroke-width="8" stroke-linejoin="round">
    <polygon points="512.0,408.0 1118.2,758.0 602.1,1160.0 602.1,460.0" fill="#ff5f8f"/>
    <polygon points="602.1,460.0 602.1,1160.0 -4.2,914.0 602.1,564.0" fill="#ff6f6f"/>
    <polygon points="602.1,564.0 -4.2,914.0 -94.2,266.0 512.0,616.0" fill="#ff8656"/>
    <polygon points="512.0,616.0 -94.2,266.0 421.9,-136.0 421.9,564.0" fill="#ffa040"/>
    <polygon points="421.9,564.0 421.9,-136.0 1028.2,110.0 421.9,460.0" fill="#f4507a"/>
    <polygon points="421.9,460.0 1028.2,110.0 1118.2,758.0 512.0,408.0" fill="#ff4fa0"/>
  </g>
  <!-- The opening -->
  <polygon points="512.0,408.0 602.1,460.0 602.1,564.0 512.0,616.0 421.9,564.0 421.9,460.0" fill="#0b0b0d"/>
</svg>
