name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are cancelled; every push to main is checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Typecheck and build
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Also rebuilds better-sqlite3 for Electron (the postinstall script).
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The Swift voice separation helper (macos-latest has the Swift toolchain). Without swiftc the script skips
      # with a note instead of failing; a compile error fails the job.
      - name: Build native helpers
        run: npm run build:helpers

      - name: Check the voice separation helper
        run: |
          if [ -x build/bin/studio-voice-isolate ]; then
            build/bin/studio-voice-isolate --probe || echo "AUSoundIsolation is not available on this runner."
          else
            echo "No helper was built (no Swift compiler); skipping its check."
          fi

      # Runs build:helpers again first, which finds the helper up to date.
      - name: Build
        run: npm run build

  # The Windows build's main process and window, typechecked and built on every push (no packaging: release.yml
  # packages and starts it). build:helpers skips the macOS-only Swift helper there.
  windows:
    name: Typecheck and build (Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Not a project dependency (see commitlint.config.mjs). A global install lets
      # commitlint resolve @commitlint/config-conventional.
      - name: Install commitlint
        run: npm install --global @commitlint/cli@19 @commitlint/config-conventional@19

      # With squash merging, the pull request title becomes the commit message on main.
      - name: Lint pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | commitlint --verbose

      - name: Lint commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      # A push straight to main gets the same check: the commits it brought (the last one when the earlier head is
      # gone, after a force push).
      - name: Lint pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            commitlint --from "$BEFORE" --to "$AFTER" --verbose
          else
            commitlint --last --verbose
          fi
