name: Release

# Pushing a version tag (v0.3.0) builds JIBES Studio on GitHub's runners and publishes one release with four files:
#   JIBES-Studio-mac-arm64.zip (what install.sh downloads) and JIBES-Studio-mac-arm64.dmg (for a download by hand) – Apple Silicon
#   JIBES-Studio-win-x64-setup.exe (the installer) and JIBES-Studio-win-x64.zip (portable) – 64-bit Windows
# and SHA256SUMS.txt, their SHA-256 checksums. Studio updates itself from the newest release (src/main/updates.ts):
# the Mac zip or the Windows installer, checked against GitHub's digest of the file or, without one, SHA256SUMS.txt.
# The Windows build is started and checked first (scripts/smoke-test.mjs); nothing is published unless both builds pass.
# "Run workflow" builds the same files without publishing anything, as artifacts of the run.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    name: Build JIBES Studio.app
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The tag must match package.json, or the release would carry another version than the app reports.
      - name: Check the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json ($want)." >&2
            exit 1
          fi

      # Also rebuilds better-sqlite3 for Electron (the postinstall script).
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The Swift helper, and the Claude Desktop extension's bridge and manifest (build/mcpb).
      - name: Build native helpers
        run: npm run build:helpers

      - name: Build
        run: npx electron-vite build

      # Ad-hoc signed (no Developer ID): a download by curl carries no quarantine flag and opens directly; a download
      # in a browser needs "Open Anyway" once (see the README).
      - name: Package
        run: npx electron-builder --mac zip dmg --arm64 --publish never

      # electron-builder only warns about a missing extraResources folder; Settings' Add to Claude Desktop needs it.
      - name: Check the Claude Desktop extension is in the app
        run: test -f "dist/mac-arm64/JIBES Studio.app/Contents/Resources/mcpb/server/index.js"

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: JIBES-Studio-mac-arm64
          path: |
            dist/JIBES-Studio-mac-arm64.zip
            dist/JIBES-Studio-mac-arm64.dmg
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Build JIBES Studio for Windows
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json ($want)." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The pinned ffmpeg build (URL and SHA-256 in the script), unpacked into build/ffmpeg-win; --check runs it and
      # fails unless it has every encoder, muxer and filter Studio uses.
      - name: Fetch ffmpeg
        run: node scripts/fetch-ffmpeg-win.mjs --check

      # The Swift voice separation helper is macOS only: build-helpers isn't run here, only the Claude Desktop
      # extension's part of it (build/mcpb, which the package step puts in resources\mcpb).
      - name: Build the Claude Desktop extension
        run: node scripts/build-mcpb.mjs

      - name: Build
        run: npx electron-vite build

      # Unsigned: SmartScreen asks once ("More info → Run anyway", see the README). Nothing native is rebuilt: Studio
      # loads better-sqlite3's own Node-API binary (prebuilds/win32-x64.node), which works in Electron as it is.
      - name: Package
        run: npx electron-builder --win nsis zip --x64 --publish never -c.npmRebuild=false

      - name: Check the Claude Desktop extension is in the app
        run: test -f dist/win-unpacked/resources/mcpb/server/index.js

      # Starts dist/win-unpacked/JIBES Studio.exe with a throwaway profile and checks over the DevTools protocol that the
      # window shows Studio, that the bundled ffmpeg reports its version, that a new library opens and Settings renders.
      - name: Smoke test
        run: node scripts/smoke-test.mjs "dist/win-unpacked/JIBES Studio.exe" --bundled-ffmpeg --screenshot dist/smoke-test-windows.png

      - name: Upload the smoke test's screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-windows
          path: dist/smoke-test-windows.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: JIBES-Studio-win-x64
          path: |
            dist/JIBES-Studio-win-x64-setup.exe
            dist/JIBES-Studio-win-x64.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the builds
        uses: actions/download-artifact@v8
        with:
          pattern: JIBES-Studio-*
          merge-multiple: true
          path: dist

      # The files' SHA-256, as sha256sum writes them ("<hex>  <name>"): what Studio checks an update against when the
      # API gives no digest for a file, and for anyone checking a download by hand (shasum -a 256 -c SHA256SUMS.txt).
      - name: Write the checksums
        working-directory: dist
        run: |
          sha256sum JIBES-Studio-mac-arm64.zip JIBES-Studio-mac-arm64.dmg JIBES-Studio-win-x64-setup.exe JIBES-Studio-win-x64.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/JIBES-Studio-mac-arm64.zip dist/JIBES-Studio-mac-arm64.dmg \
            dist/JIBES-Studio-win-x64-setup.exe dist/JIBES-Studio-win-x64.zip \
            dist/SHA256SUMS.txt \
            --title "JIBES Studio $GITHUB_REF_NAME" \
            --generate-notes
