version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Gives "build(deps): bump …" and "build(deps-dev): bump …".
    commit-message:
      prefix: build
      include: scope
    # Minor and patch updates arrive as one pull request per group. Major updates
    # (Electron, React, TypeScript …) get their own pull request so they can be tested on their own.
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Gives "ci(deps): bump …".
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ['*']
